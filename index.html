<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Catch</title>
    <style>
      :root {
        --bg1: #160d28;
        --bg2: #402564;
        --bg3: #7a3db0;
        --pink: #ff79c9;
        --rose: #ff9ad8;
        --gold: #ffd166;
        --white: #fff9ff;
        --lavender: #d9c4ff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #120a22 0%, #2c1844 20%, #4d2a79 45%, #6f3fa2 62%, #ff82c8 100%);
        color: var(--white);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        position: relative;
        min-height: 100vh;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        filter: blur(22px);
        opacity: 0.6;
        animation: drift 12s ease-in-out infinite alternate;
      }

      body::before {
        background: rgba(255, 209, 102, 0.26);
        top: 7%;
        left: 7%;
      }

      body::after {
        background: rgba(255, 121, 201, 0.22);
        right: 6%;
        bottom: 10%;
        animation-delay: 2s;
      }

      .content {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 35%, rgba(255,255,255,0.17), transparent 25%),
          linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.08));
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255,255,255,0.12), transparent 55%);
      }

      .sparkle {
        position: absolute;
        width: 12px;
        height: 12px;
        background: rgba(255,255,255,0.88);
        clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
        animation: twinkle 2.8s ease-in-out infinite alternate;
      }

      .sparkle:nth-child(1) { top: 10%; left: 12%; animation-delay: 0.2s; }
      .sparkle:nth-child(2) { top: 18%; right: 18%; animation-delay: 1.1s; }
      .sparkle:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 0.7s; }
      .sparkle:nth-child(4) { bottom: 15%; right: 16%; animation-delay: 1.8s; }
      .sparkle:nth-child(5) { top: 42%; left: 8%; animation-delay: 0.4s; }
      .sparkle:nth-child(6) { top: 50%; right: 12%; animation-delay: 1.4s; }
      .sparkle:nth-child(7) { top: 28%; left: 48%; animation-delay: 0.9s; }
      .sparkle:nth-child(8) { bottom: 30%; right: 40%; animation-delay: 1.3s; }

      h1 {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 5rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow: 0 0 22px rgba(255, 209, 102, 0.9), 0 0 45px rgba(255, 145, 208, 0.4);
        animation: fadeSlide 1s ease-out;
      }

      .subtitle {
        position: absolute;
        top: 170px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
        animation: fadeSlide 1.2s ease-out;
      }

      .mini-love {
        position: absolute;
        top: 218px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2.2rem;
        animation: pulse 1.4s ease-in-out infinite alternate, fadeSlide 1.3s ease-out;
      }

      #moveBtn {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translate(-50%, -50%);
        border: none;
        border-radius: 999px;
        padding: 18px 30px;
        min-width: 170px;
        background: linear-gradient(135deg, var(--gold) 0%, #ffbbdf 22%, var(--pink) 100%);
        color: #351d52;
        font-size: clamp(0.8rem, 2.8vw, 1rem);
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 18px 35px rgba(255, 110, 199, 0.4), 0 0 18px rgba(255, 209, 102, 0.35);
        transition: left 0.25s ease, top 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        user-select: none;
        border: 2px solid rgba(255,255,255,0.45);
        touch-action: manipulation;
      }

      #moveBtn:hover {
        filter: brightness(1.08);
        box-shadow: 0 22px 38px rgba(255, 110, 199, 0.48), 0 0 25px rgba(255, 209, 102, 0.45);
      }

      #moveBtn:active {
        transform: translate(-50%, -50%) scale(0.97);
      }

      @keyframes twinkle {
        0% { transform: scale(0.7); opacity: 0.35; }
        100% { transform: scale(1.35); opacity: 1; }
      }

      @keyframes drift {
        0% { transform: translate(-10px, -8px) scale(1); }
        100% { transform: translate(12px, 18px) scale(1.15); }
      }

      @keyframes pulse {
        from { transform: translateX(-50%) scale(0.98); }
        to { transform: translateX(-50%) scale(1.18); }
      }

      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @media (max-width: 640px) {
        body::before,
        body::after {
          width: 220px;
          height: 220px;
        }

        h1 {
          top: 52px;
          letter-spacing: 0.12em;
        }

        .subtitle {
          top: 128px;
          letter-spacing: 0.15em;
          text-align: center;
          width: 80%;
          font-size: 0.72rem;
        }

        .mini-love {
          top: 168px;
          font-size: 1.8rem;
        }

        #moveBtn {
          top: 58%;
          padding: 16px 22px;
          min-width: 150px;
          letter-spacing: 0.12em;
        }
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="glow"></div>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>

      <h1></h1>
      <p class="subtitle">Catch me if you can</p>
      <div class="mini-love">🎉</div>
      <button id="moveBtn" type="button">Click Me</button>
    </div>

    <script>
      const button = document.getElementById('moveBtn');
      let clickCount = 0;
      const maxClicks = 6;

      function moveButton() {
        const maxX = window.innerWidth - button.offsetWidth - 30;
        const maxY = window.innerHeight - button.offsetHeight - 30;

        const x = Math.random() * Math.max(20, maxX - 20) + 10;
        const y = Math.random() * Math.max(20, maxY - 20) + 10;

        button.style.left = x + 'px';
        button.style.top = y + 'px';
      }

      button.addEventListener('click', function () {
        clickCount += 1;

        if (clickCount >= maxClicks) {
          window.location.href = 'next.html';
          return;
        }

        moveButton();
      });
    </script>
  </body>
</html>
