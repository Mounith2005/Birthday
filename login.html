<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Login</title>
    <style>
      :root {
        --bg1: #140b2d;
        --bg2: #2d1d49;
        --bg3: #6e3bb1;
        --pink: #ff7ec7;
        --gold: #ffd166;
        --white: #fffafc;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #140b2d 0%, #2d1d49 35%, #4f2d7d 65%, #ff93c9 100%);
        color: var(--white);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .login-card {
        position: relative;
        width: min(90vw, 420px);
        padding: 36px 24px 28px;
        border-radius: 28px;
        background: rgba(28, 13, 42, 0.7);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 20px 60px rgba(0,0,0,0.28);
        text-align: center;
      }

      .lock {
        font-size: 3rem;
        margin-bottom: 10px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold);
      }

      p {
        margin: 0 0 20px;
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.08em;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.06);
        color: var(--white);
        font-size: 1rem;
        outline: none;
        margin-bottom: 16px;
      }

      input::placeholder {
        color: rgba(255,255,255,0.5);
      }

      button {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--gold), var(--pink));
        color: #351d52;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .error {
        min-height: 22px;
        margin-top: 12px;
        color: #ffd1e5;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="lock">🔒</div>
      <h2>Birthday Lock</h2>
      <p>Enter the special date</p>
      <input id="passwordInput" type="password" placeholder="dd-mm-yyyy" />
      <button id="submitBtn" type="button">Unlock</button>
      <div id="errorMessage" class="error"></div>
    </div>

    <script>
      const correctPassword = '27-08-2005';
      const input = document.getElementById('passwordInput');
      const button = document.getElementById('submitBtn');
      const error = document.getElementById('errorMessage');

      function unlockPage() {
        const value = input.value.trim();

        if (value === correctPassword) {
          window.location.href = 'next.html';
        } else {
          error.textContent = 'Incorrect date. Try again.';
          input.value = '';
          input.focus();
        }
      }

      button.addEventListener('click', unlockPage);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          unlockPage();
        }
      });
    </script>
  </body>
</html>
